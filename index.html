<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="漢字鬼斬り帖"><link rel="apple-touch-icon" href="assets/hero_t5.png"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>漢字鬼斬り帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@400;600&family=Yuji+Syuku&display=swap">
<style>
/* Layout: one-column game screen — status bar, battle arena, then a paper "drill sheet" for the question */
:root{
  --night:#120d16; --night2:#24161f; --ink:#22202a; --paper:#f4ecd6; --paper-line:#d9c9a3;
  --gold:#e9b949; --hp:#5bd17a; --red:#d7263d; --exp:#57b6ff; --muted:#bba9b4; --text:#f5efe6;
  --brush:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --pixel:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --kyokasho:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background-image:radial-gradient(circle at 50% -10%,rgba(215,38,61,.18),transparent 55%),repeating-radial-gradient(circle at 0 100%,transparent 0 14px,rgba(233,185,73,.05) 14px 16px,transparent 16px 22px);background-attachment:fixed;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;background:var(--night);color:var(--text);font-family:var(--pixel);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 32px;display:flex;flex-direction:column;gap:14px}
button{font-family:var(--pixel);font-size:16px;cursor:pointer;color:var(--text)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--night2);border:2px solid var(--muted);border-radius:6px;padding:10px 14px;box-shadow:0 3px 0 #0a0d1d}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0d1d}
.btn.gold{background:var(--gold);color:var(--ink);border-color:#fff3c4}
.btn.small{font-size:14px;padding:6px 10px}
h1{font-family:var(--brush);font-weight:400;font-size:clamp(34px,9vw,56px);margin:0;letter-spacing:.08em;color:var(--text);text-shadow:3px 3px 0 var(--red),6px 6px 0 #000;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}

/* hero card */
.herocard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--night2);border:2px solid #5a3044;border-radius:8px;padding:12px}
.herocard img{width:96px;height:115px;object-fit:contain}
img.px{image-rendering:pixelated}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.lv{font-size:22px;color:var(--gold)}
.title{font-size:15px}
.bar{height:12px;background:#0b0f22;border:2px solid #000;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;transition:width .4s}
.bar.exp>i{background:var(--exp)}
.bar.hp>i{background:var(--hp)}
.small-num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.panel{background:var(--night2);border:2px solid #5a3044;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:16px;color:var(--gold);letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:#0f1430;border:2px solid #5a3044;border-radius:6px;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:#fff3c4}

.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stage{display:flex;gap:10px;align-items:center;text-align:left;background:#0f1430;border:2px solid #5a3044;border-radius:8px;padding:10px;min-width:0}
.stage img{width:56px;height:56px;object-fit:contain;flex:none}
.stage .nm{font-size:15px;line-height:1.3}
.stage .meta{font-size:12px;color:var(--muted)}
.stage .clear{color:var(--gold)}
.stage.weak{border-color:var(--red)}
.chapter{display:flex;flex-direction:column;gap:8px}
.chname{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--text);border-bottom:1px dashed #5a3044;padding-bottom:4px}
.chprog{color:var(--gold);font-variant-numeric:tabular-nums}
.stage.locked{opacity:.55;cursor:default}
.stage.locked img{filter:brightness(0) opacity(.6)}
.idle-rival{animation:idleHero 1.1s steps(2) infinite}
.mname.rivalname{background:rgba(60,0,90,.85);border:1px solid #c88aff}
.rival-in{animation:rivalIn .9s cubic-bezier(.2,.8,.3,1)}
@keyframes rivalIn{0%{transform:translate(160px,-80px) scale(.6);opacity:0;filter:brightness(4)}50%{opacity:1;filter:brightness(4)}70%{transform:none;filter:none}100%{transform:none}}
.rival-out{animation:rivalOut .9s ease-in forwards}
@keyframes rivalOut{0%{transform:none}25%{transform:translateY(8px) scale(1,.92)}100%{transform:translate(120px,-260px) scale(.6);opacity:0}}
.maskfly{position:absolute;width:70px;z-index:4;pointer-events:none;animation:maskfly 1.3s ease-out forwards}
@keyframes maskfly{0%{transform:none}30%{transform:translate(40px,-90px) rotate(200deg)}100%{transform:translate(160px,140px) rotate(540deg);opacity:0}}
#talk{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(transparent 55%,rgba(0,0,0,.45));cursor:pointer}
.talkbox{position:relative;width:min(100%,720px);display:flex;gap:12px;align-items:flex-start;background:#0b0f26;border:3px solid #fff;border-radius:10px;padding:12px;box-shadow:0 0 0 3px #000,0 6px 0 #000}
.talkbox.rival{border-color:#c88aff}
.talkbox .face{width:84px;height:84px;object-fit:cover;object-position:50% 20%;border:2px solid #5a3044;border-radius:6px;background:#1f2850;flex:none}
.tbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.tname{font-size:14px;color:var(--gold)}
.talkbox.rival .tname{color:#d9b0ff}
.ttext{font-size:clamp(17px,4.2vw,22px);line-height:1.6;min-height:3.2em}
.tnext{position:absolute;right:12px;bottom:6px;color:var(--gold);animation:pulse 1s infinite}
.rivaltag{display:inline-block;font-size:11px;color:#d9b0ff;border:1px solid #8a5ac0;border-radius:999px;padding:0 6px;margin-left:4px}
.finalstage{border-color:#8a5ac0;background:linear-gradient(90deg,#1a1030,#0f1430)}
.badge{display:inline-block;margin-left:8px;font-size:11px;background:linear-gradient(90deg,#ffe27a,#ff9ad5,#9ad5ff);color:#22202a;border-radius:999px;padding:1px 8px;vertical-align:middle}
.endroll{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;animation:fadein 1.5s}
@keyframes fadein{from{opacity:0}}
.endin{width:100%;height:100%;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 16px;text-align:center;box-shadow:inset 0 0 0 2000px rgba(0,0,20,.35);overflow:auto}
.endin h2{font-size:clamp(36px,10vw,64px);color:#fff3b0;text-shadow:3px 3px 0 #000,0 0 20px #ffb000;margin:0;letter-spacing:.12em}
.endin p{margin:0;line-height:1.7;text-shadow:2px 2px 0 #000;font-size:16px}
.endin b{color:var(--gold)}
.endpair{display:flex;gap:16px;align-items:flex-end}
.endpair img{height:min(28vh,200px);width:auto}
.endpair img.flip{transform:scaleX(-1)}
.endstat{font-size:14px!important;color:#dfe4ff}
.endmsg{font-size:18px!important}
.sppanel{border-color:#8a2a3a;background:linear-gradient(135deg,#2a0a20,#1f2850)}
.spstage{border-color:#c0405a;background:#140818}
.spstage img{width:72px;height:72px}
.arena.spfight{height:420px;box-shadow:inset 0 0 0 2px #c0405a,inset 0 -80px 100px rgba(120,0,40,.45)}
.arena.spfight .mon.boss{width:min(74%,520px);right:-3%}
.arena.spfight .mon .mname{position:absolute;z-index:2;right:6px;bottom:62px}
.arena.spfight .mon.boss img{height:370px;filter:drop-shadow(0 0 18px rgba(255,40,80,.6)) drop-shadow(0 12px 0 rgba(0,0,0,.5))}
@media (max-width:420px){.arena.spfight{height:340px}.arena.spfight .mon.boss img{height:280px}.arena.spfight .mon.boss{width:76%}}
.sp-rise{animation:spRise 1.8s cubic-bezier(.2,.7,.2,1)}
@keyframes spRise{0%{transform:translateY(260px) scale(.8);filter:brightness(0)}55%{transform:translateY(-10px) scale(1.05);filter:brightness(0) drop-shadow(0 0 20px #f0f)}70%{filter:brightness(3)}85%{transform:none;filter:none}100%{transform:none}}
.warn{position:absolute;inset:0;background:rgba(40,0,0,.55);display:flex;align-items:center;z-index:5;pointer-events:none;animation:warnbg 2s forwards}
@keyframes warnbg{0%,80%{opacity:1}100%{opacity:0}}
.warnband{width:100%;overflow:hidden;background:repeating-linear-gradient(45deg,#c00010 0 18px,#000 18px 36px);padding:6px 0;animation:pulse .35s steps(2) infinite}
.warnband span{display:block;white-space:nowrap;font-size:clamp(22px,6vw,40px);color:#fff;text-shadow:3px 3px 0 #000;letter-spacing:.2em;animation:warnscroll 2s linear}
@keyframes warnscroll{from{transform:translateX(60%)}to{transform:translateX(-60%)}}
.sealk{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none;font-family:var(--kyokasho);font-weight:600;font-size:clamp(56px,14vw,96px);line-height:1;white-space:nowrap}
.sealk span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff3b0;text-shadow:0 0 12px #ffb000,0 0 30px #ff5000,3px 3px 0 #000;animation:sealpop 1.05s forwards}
.sealk .l{clip-path:polygon(0 0,58% 0,42% 100%,0 100%);--sx:-46px;--sr:-14deg}
.sealk .r{clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%);--sx:46px;--sr:14deg}
@keyframes sealpop{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--sx)),calc(-50% + 50px)) rotate(var(--sr)) scale(.9);opacity:0}}
.spark{position:absolute;width:8px;height:8px;background:#ffe27a;box-shadow:0 0 8px #ffb000;z-index:4;pointer-events:none;animation:spark .85s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.bigflash.sp{background:radial-gradient(circle at 70% 50%,#fff,#ffcc66 30%,transparent 65%)}
.healfx{position:absolute;inset:0;background:radial-gradient(circle,rgba(160,0,255,.55),transparent 60%);animation:redflash .9s forwards;pointer-events:none}
.sealbar{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:14px}
.sealbar b{color:#ff8a8a;font-size:18px}
.seals{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.seals i{width:10px;height:10px;background:#c0405a;border:1px solid #000;transform:rotate(45deg)}
.seals i.off{background:#3a3a50;opacity:.5}
.bar.mp>i{background:#4a8cff}
.hero .bar.mp{width:120px;height:8px}
@media (max-width:420px){.hero .bar.mp{width:100px}}
.skillbtn{background:#1a2a60;border-color:#6a8cff}
.skillbtn:not(:disabled){box-shadow:0 0 0 2px rgba(106,140,255,.35),0 3px 0 #0a0d1d;animation:pulse 1.6s ease-in-out infinite}
.skillbtn:disabled{opacity:.45;animation:none}
.mpcost{font-size:11px;background:#4a8cff;color:#fff;border-radius:4px;padding:0 4px;margin-right:6px}
.jobtag{display:inline-block;font-size:12px;background:#1a2a60;border:1px solid #6a8cff;border-radius:4px;padding:0 6px;margin-right:6px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.jobcard{display:flex;gap:10px;align-items:center;text-align:left;background:#0f1430;border:2px solid #5a3044;border-radius:8px;padding:8px;min-width:0}
.jobcard img{width:60px;height:70px;object-fit:contain;flex:none}
.jobcard.cur{border-color:var(--gold);background:#2a2410}
.jobcard.locked{opacity:.5}
.jobcard.locked img{filter:brightness(0) opacity(.6)}
.jobcard .meta.sk{color:#b8c8ff}
.nowjob{font-size:11px;color:var(--gold);margin-left:6px}
.jobglow{filter:drop-shadow(0 0 16px #ffe27a);animation:bossIn 1s}
.h-cast{animation:hCast .6s ease-out}
@keyframes hCast{0%{transform:none}40%{transform:translateY(-14px) scale(1.06)}100%{transform:none}}
.fx-glow{position:absolute;left:2%;bottom:0;width:34%;height:80%;pointer-events:none;z-index:3;background:radial-gradient(closest-side,var(--c),transparent);opacity:0;animation:fxglow 1.2s ease-out}
@keyframes fxglow{20%{opacity:.85}100%{opacity:0;transform:scale(1.4)}}
.fx-heal{position:absolute;left:2%;bottom:0;width:34%;height:90%;pointer-events:none;z-index:3;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(140,255,170,.5) 14px 18px);animation:fxheal 1.2s ease-out forwards;mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
@keyframes fxheal{from{transform:translateY(60px);opacity:0}30%{opacity:1}to{transform:translateY(-80px);opacity:0}}
.fx-clone{position:absolute;left:4%;bottom:10px;width:130px;height:150px;pointer-events:none;z-index:3;border-radius:50%;box-shadow:-30px 0 30px rgba(180,190,255,.6),30px 0 30px rgba(180,190,255,.6);animation:fxglow 1.1s ease-out}
.fx-fire{position:absolute;inset:0;pointer-events:none;z-index:3}
.fx-fire i{position:absolute;right:18%;top:20%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff6a0,#ff9020 40%,#e02000 70%,transparent 72%);animation:fireball .65s ease-in forwards}
.fx-fire i:nth-child(2){animation-delay:.08s;width:80px;height:80px;top:35%}
.fx-fire i:nth-child(3){animation-delay:.16s;width:90px;height:90px;top:10%}
.fx-fire i:nth-child(4){animation-delay:.6s;right:10%;top:5%;width:260px;height:260px;animation:boom .6s .6s ease-out forwards;opacity:0}
.fx-fire i:nth-child(5){animation-delay:.7s;right:14%;top:15%;width:200px;height:200px;animation:boom .6s .72s ease-out forwards;opacity:0}
@keyframes fireball{from{transform:translateX(-420px) scale(.4);opacity:1}to{transform:none;opacity:1}}
@keyframes boom{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.3);opacity:0}}
.bushuq{display:flex;flex-direction:column;align-items:center;gap:4px}
.bushuq .bk{font-family:var(--kyokasho);font-weight:600;font-size:clamp(80px,22vw,130px);line-height:1;color:var(--ink)}
.bushuq .bw{font-size:clamp(18px,4.5vw,24px)}
.bushuq .bw b{color:#b3322f}
.tag.bushu{background:#2a6a4a}
.choices.bushuc .choice{font-family:var(--pixel);font-size:clamp(18px,4.6vw,24px)}
.choices.six{grid-template-columns:1fr 1fr 1fr}
.choices.six .choice{font-size:clamp(17px,4vw,24px);padding:10px 4px}
@media (max-width:420px){.choices.six{grid-template-columns:1fr 1fr}}
.sptimer{position:relative;height:22px;background:#2a2030;border:2px solid #000;border-radius:4px;overflow:hidden}
.sptimer i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3fd17a,#ffd84d);transition:width .1s linear}
.sptimer.hurry i{background:#e5484d;animation:pulse .4s infinite}
.sptimer span{position:relative;display:block;text-align:center;font-family:var(--pixel);font-size:13px;color:#fff;text-shadow:1px 1px 0 #000;line-height:18px}
.lvnote{position:absolute;left:0;right:0;top:68%;text-align:center;color:#fff;font-size:16px;text-shadow:2px 2px 0 #000;line-height:1.6}
.splv{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.splv i{font-style:normal;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid #6a2a3a;border-radius:3px;color:var(--muted)}
.splv i.won{background:#c0405a;color:#fff;border-color:#ff8a8a}
.splv i.now{border-color:var(--gold);color:var(--gold);animation:pulse 1.2s infinite}
.spamb{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.spamb span{position:absolute;bottom:-40px;font-family:var(--kyokasho);font-weight:600;color:var(--aura);opacity:.75;text-shadow:0 0 8px var(--aura);animation:floatk 6s linear infinite}
@keyframes floatk{from{transform:translateY(0) rotate(0)}to{transform:translateY(-480px) rotate(40deg);opacity:0}}
.arena.spfight .mon.boss img{transition:filter .3s}
.arena.fx2 .mon.boss img{filter:drop-shadow(0 0 22px var(--aura)) drop-shadow(0 12px 0 rgba(0,0,0,.5))}
.arena.fx3 .mon.boss img,.arena.fx4 .mon.boss img{filter:drop-shadow(0 0 28px var(--aura)) drop-shadow(0 0 60px var(--aura))}
.arena.fx3{box-shadow:inset 0 0 60px rgba(64,200,255,.45),inset 0 0 0 2px #40c8ff}
.arena.fx4{box-shadow:inset 0 0 70px rgba(192,96,255,.55),inset 0 0 0 2px #c060ff}
.arena.fx4 .mon.boss,.arena.fx5 .mon.boss,.arena.fx6 .mon.boss{width:min(80%,580px)!important}
.arena.fx4 .mon.boss img,.arena.fx5 .mon.boss img,.arena.fx6 .mon.boss img{height:390px}
.arena.fx5{box-shadow:inset 0 0 80px rgba(255,216,77,.55),inset 0 0 0 3px #ffd84d}
.arena.fx5 .mon.boss img{filter:drop-shadow(0 0 30px #ffd84d) drop-shadow(0 0 80px #ff9000)}
.arena.fx5::before,.arena.fx6::before{content:"";position:absolute;right:8%;top:6%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,transparent 40%,rgba(255,220,100,.55) 46%,transparent 52%,rgba(255,220,100,.3) 58%,transparent 64%);animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.arena.rainbow{animation:rbw 3s linear infinite}
@keyframes rbw{0%{box-shadow:inset 0 0 90px #ff4060,inset 0 0 0 3px #ff4060}33%{box-shadow:inset 0 0 90px #40ff90,inset 0 0 0 3px #40ff90}66%{box-shadow:inset 0 0 90px #4080ff,inset 0 0 0 3px #4080ff}100%{box-shadow:inset 0 0 90px #ff4060,inset 0 0 0 3px #ff4060}}
.arena.rainbow .mon.boss img{animation:rbwimg 3s linear infinite}
@keyframes rbwimg{0%{filter:drop-shadow(0 0 30px #ff4060) hue-rotate(0)}50%{filter:drop-shadow(0 0 40px #40a0ff) hue-rotate(30deg)}100%{filter:drop-shadow(0 0 30px #ff4060) hue-rotate(0)}}
.arena.rainbow::before{background:radial-gradient(circle,transparent 40%,rgba(255,255,255,.6) 46%,transparent 52%,rgba(180,140,255,.45) 58%,transparent 64%)!important;width:380px!important;height:380px!important}
@media (max-width:420px){.arena.fx4 .mon.boss img,.arena.fx5 .mon.boss img,.arena.fx6 .mon.boss img{height:300px}.arena.fx5::before,.arena.fx6::before{width:200px;height:200px}}
.bolt{position:absolute;top:0;width:18px;height:70%;z-index:4;pointer-events:none;background:linear-gradient(#fff,#d8a0ff);clip-path:polygon(40% 0,100% 0,60% 40%,90% 40%,20% 100%,40% 55%,0 55%);filter:drop-shadow(0 0 12px #c060ff);animation:redflash .45s forwards}
.allies{position:absolute;left:1%;bottom:64px;display:flex;align-items:flex-end;gap:0;z-index:0;pointer-events:none}
.allies .ally{height:112px;width:auto;margin-right:-26px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4)) brightness(.92)}
.arena.bossfight .mname.kishoname{position:absolute;right:6px;bottom:62px;z-index:2}
.arena .hero{left:30%!important}
@media (max-width:420px){.allies{bottom:56px}.allies .ally{height:76px;margin-right:-20px}.arena .hero{left:24%!important}}
.ally-go{animation:allyGo .6s ease-out}
@keyframes allyGo{40%{transform:translateX(70px) translateY(-8px)}100%{transform:none}}
.mname.kishoname{background:linear-gradient(90deg,#5a0010,#a01020);border:1px solid #ffcf60;color:#fff3c4;font-size:16px}
.kishocall{position:absolute;left:0;right:0;top:22%;text-align:center;z-index:6;pointer-events:none;animation:bosscall 2.2s forwards;color:#fff;text-shadow:4px 4px 0 #000,0 0 24px #f00}
.kishocall b{font-family:var(--brush);font-weight:400;font-size:clamp(90px,24vw,150px);color:#ffcf60;display:block;line-height:1}
.kishocall span{font-family:var(--brush);font-size:clamp(28px,7vw,44px)}
.maoucall b{color:#ff3050}
.maou-dark{filter:saturate(1.4) brightness(.8)}
.maou-swell{animation:maouSwell 2.2s ease-in}
@keyframes maouSwell{0%{transform:none}30%{transform:scale(1.05) translateX(-4px)}60%{transform:scale(1.25);filter:brightness(0) drop-shadow(0 0 30px #f00)}100%{transform:scale(1.6);filter:brightness(0) drop-shadow(0 0 60px #f00);opacity:.2}}
.corps .corpsrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}

.kisho b{position:absolute;left:4px;top:2px;font-family:var(--brush);font-weight:400;font-size:20px;color:#ff8a8a}
.kisho img{height:58px;width:auto;filter:brightness(0) drop-shadow(0 0 4px #c03050)}
.kisho.won img{filter:grayscale(.7) brightness(.7)}
.kisho.won::after{content:"討";position:absolute;right:4px;bottom:16px;font-family:var(--brush);color:var(--gold);font-size:24px;transform:rotate(-12deg)}
.kisho span{font-size:11px}
.train .revst{border-color:#8a5ac0;background:linear-gradient(90deg,#24103a,#0f1430)}
.duecnt{color:#ff8a8a;margin-left:6px}
.trainrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:#1a0f16;border:2px solid #5a3044;border-radius:8px;padding:10px 4px}

.tbtn span{font-size:12px;color:var(--muted)}
.mbar{height:6px;background:#0b0f22;border-radius:3px;overflow:hidden}

.chname.gold{color:var(--gold)}
.stars{letter-spacing:1px}
.starlist{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.starlist .on{color:var(--gold)}
#monArt.shiny img{filter:sepia(1) saturate(3.5) hue-rotate(-8deg) brightness(1.2) drop-shadow(0 0 10px #ffd84d) drop-shadow(0 0 22px #ffb000)!important}
#monArt.shiny::after{content:"✦";position:absolute;right:10%;top:5%;color:#fff3b0;font-size:26px;text-shadow:0 0 10px #ffb000;animation:pulse .8s infinite}
#monArt.revival img{filter:hue-rotate(220deg) saturate(1.3) brightness(.95) drop-shadow(0 0 12px #b060ff)}
.ovbox.wide{max-width:680px}
.dex{max-height:58vh;overflow:auto;width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.dexh{font-size:12px;color:var(--gold);border-bottom:1px dashed #5a3044;margin-bottom:4px}
.dexrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.dexc{display:flex;flex-direction:column;align-items:center;background:#1a0f16;border:1px solid #5a3044;border-radius:6px;padding:4px;min-width:0}
.ovbox .dexc img{width:60px;height:60px;object-fit:contain}
.dexc span{font-size:10px;text-align:center;line-height:1.2}
.dexc small{font-size:10px;color:var(--muted)}
.dexc.unk img{filter:brightness(0) opacity(.5)}
.dexc.gold{border-color:#ffd84d;box-shadow:0 0 8px #ffb000}
.dexc.gold img{filter:sepia(1) saturate(3.5) hue-rotate(-8deg) brightness(1.2)}
.smith{display:flex;flex-direction:column;gap:6px;width:100%;max-height:58vh;overflow:auto}
.sw{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;background:#1a0f16;border:1px solid #5a3044;border-radius:8px;padding:6px 8px;text-align:left}
.sw.eq{border-color:var(--gold);background:#2a2410}
.katana{width:70px;height:18px}
.swb{display:flex;flex-direction:column;min-width:0}
.swb small{font-size:11px;color:var(--muted)}
.swbtn{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.hyakubar{position:absolute;left:8px;right:8px;top:8px;height:24px;background:rgba(0,0,0,.6);border:2px solid #000;border-radius:6px;overflow:hidden;z-index:5}
.hyakubar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#d7263d,#e9b949);transition:width .1s linear}
.hyakubar i.hurry{animation:pulse .4s infinite}
.hyakubar span,.hyakubar b{position:relative;font-size:14px;line-height:20px;padding:0 8px;text-shadow:1px 1px 0 #000}
.hyakubar b{float:right;color:#fff3b0;font-weight:normal}
.daily .dq{display:flex;flex-direction:column;gap:8px}
.quest{background:#0f1430;border:2px solid #5a3044;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.quest.done{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,193,78,.25)}
.quest.claimed{opacity:.6}
.quest.bonus{border-style:dashed}
.qt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.qr{color:var(--gold);font-size:12px}
.qrow{display:flex;align-items:center;gap:8px}
.qrow .bar{flex:1;min-width:60px}
.qrow .bar>i{background:var(--gold)}
.qok{font-size:12px;color:var(--hp)}
.dinfo{display:flex;flex-direction:column;gap:4px}
.itemsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.itm{display:inline-flex;align-items:center;gap:4px;background:#0f1430;border:1px solid #5a3044;border-radius:6px;padding:2px 8px}
.ico{display:inline-block;width:18px;height:18px;flex:none}
.ico svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.cal{display:flex;flex-direction:column;gap:6px}
.calh{font-size:13px;color:var(--muted)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:360px}
.calg b{font-size:11px;color:var(--muted);text-align:center;font-weight:normal}
.calg i{font-style:normal;font-size:11px;text-align:center;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;background:#0f1430;color:var(--muted);font-variant-numeric:tabular-nums}
.calg i:empty:not(.st){background:transparent}
.calg i.st{background:radial-gradient(circle,#ffe27a 0 45%,#c99a1e 46% 58%,#0f1430 60%)}
.calg i.td{outline:2px solid var(--exp)}
.lb{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.lbday{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0f1430;border:2px solid #5a3044;border-radius:6px;padding:4px 2px;font-size:10px;min-width:0}
.lbday span{color:var(--muted)}
.lbday b{color:var(--exp);font-size:12px}
.lbday small{font-size:9px;line-height:1.2;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.lbday .ico{width:20px;height:20px}
.lbday.got{opacity:.45}
.lbday.got::after{content:"ずみ";font-size:9px;color:var(--hp)}
.lbday.now{border-color:var(--gold);background:#3a2a10;animation:pulse 1.2s ease-in-out infinite}
.chest{width:26px;height:20px;background:linear-gradient(#e0a020 0 40%,#000 40% 46%,#b07010 46%);border:2px solid #000;border-radius:4px 4px 2px 2px;position:relative}
.chest::after{content:"";position:absolute;left:50%;top:30%;width:6px;height:7px;margin-left:-3px;background:#fff3c4;border:1px solid #000}
.chest.open{width:80px;height:60px;box-shadow:0 0 30px 10px rgba(255,220,100,.6);animation:bossIn .8s}
.itembar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.itembtn{display:inline-flex;align-items:center;gap:6px}
.itembtn:disabled{opacity:.4}
.buff{font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px}
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:#3a2a10;border:2px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:8px;font-size:15px;text-align:center;box-shadow:0 4px 0 #000;max-width:calc(100% - 32px);transition:opacity .5s,transform .5s}
.toast small{color:var(--muted)}
.toast.out{opacity:0;transform:translateY(-20px)}
.skills{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.skill{font-size:11px;background:#3a2a10;color:var(--gold);border:1px solid #8a6a20;border-radius:999px;padding:1px 8px}
.skills .next{font-size:11px;color:var(--muted)}
/* レベルが高い剣士のオーラ */
.hero.aura1 #heroArt::before,.hero.aura2 #heroArt::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-4%;height:80%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,215,80,.55),transparent);animation:aura 1.4s ease-in-out infinite;z-index:-1}
.hero.aura2 #heroArt::before{background:radial-gradient(closest-side,rgba(255,255,255,.6),rgba(140,200,255,.35) 50%,rgba(255,120,220,.2) 75%,transparent)}
@keyframes aura{50%{transform:scale(1.12);opacity:.7}}
.hero #heroArt{z-index:0}
.skillcall{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:var(--brush);font-size:clamp(26px,7vw,42px);color:#fff3b0;text-shadow:2px 2px 0 #000,0 0 14px #ffb000;pointer-events:none;animation:bosscall 1.2s forwards;z-index:3}
.bigflash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:redflash .5s forwards;z-index:2}
.lvnew{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:#0f1430;border:1px solid #5a3044;border-radius:8px;padding:10px;font-size:14px;line-height:1.5}
.lvnew b{color:var(--gold)}
.lvpair{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.lvpair img{width:90px;height:110px;object-fit:contain}
.lvpair .arrow{font-size:22px;color:var(--gold);padding-bottom:40px}

/* battle */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .area{font-size:14px;color:var(--muted);min-width:0}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border:2px solid var(--muted);border-radius:2px}
.dots i.done{background:var(--gold);border-color:var(--gold)}
.dots i.now{border-color:var(--red);background:#5a1d22}
.arena{position:relative;background-size:cover!important;background-position:center bottom!important;height:290px;border:3px solid #000;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px #5a3044}
.arena .ground{position:absolute;left:0;right:0;bottom:0;height:38%;background:rgba(0,0,0,.25)}
.mon{position:absolute;right:4%;bottom:14px;width:190px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mon img{width:150px;height:150px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.mon .mname{font-size:13px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px;white-space:nowrap}
.mon .bar{width:130px}
.mon.boss img{width:190px;height:190px}
/* 大型ボス：アリーナを高くして画面の右半分以上を占める */
.arena.bossfight{height:400px;box-shadow:inset 0 0 0 2px #7a1f2a,inset 0 -60px 80px rgba(80,0,0,.35)}
.arena.bossfight .mon.boss{right:-1%;bottom:4px;width:min(66%,460px)}
.arena.bossfight .mon.boss img{width:100%;height:330px;filter:drop-shadow(0 0 14px rgba(255,50,40,.5)) drop-shadow(0 10px 0 rgba(0,0,0,.45))}
.arena.bossfight .mon.boss .bar{width:72%;height:16px}
.arena.bossfight .mon.boss .mname{font-size:16px;background:rgba(110,0,10,.8);border:1px solid #ff8a8a}
#monArt,#heroArt{position:relative;transform-origin:50% 100%}
/* 待機モーション（ドット絵らしく、少しカクカク動かす） */
.hero img{transform-origin:50% 100%;animation:idleHero 1.1s steps(2) infinite}
@keyframes idleHero{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(1,1.025)}}
.mon img{transform-origin:50% 100%}
.idle-slime,.idle-king{animation:idleSlime 1.2s ease-in-out infinite}
@keyframes idleSlime{0%,100%{transform:scale(1.06,.94)}50%{transform:scale(.96,1.05)}}
.idle-bat{animation:idleFly .9s ease-in-out infinite}
.idle-ghost{animation:idleFly 1.8s ease-in-out infinite}
@keyframes idleFly{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.idle-mush{animation:idleSway 1.4s steps(4) infinite}
@keyframes idleSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.idle-golem{animation:idleHeavy 1.6s steps(2) infinite}
@keyframes idleHeavy{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) scale(1.01,.99)}}
.idle-dragon{animation:idleBreath 2s ease-in-out infinite}
@keyframes idleBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035,1.02) translateY(-3px)}}
/* 攻撃・ダメージ */
.h-atk{animation:hAtk .45s ease-out}
@keyframes hAtk{0%{transform:none}25%{transform:translateX(-10px)}55%{transform:translateX(95px) translateY(-6px)}75%{transform:translateX(80px)}100%{transform:none}}
.h-hurt{animation:hHurt .5s linear}
@keyframes hHurt{0%{transform:none;filter:none}15%{transform:translateX(-18px) rotate(-4deg);filter:brightness(2.2) sepia(1) saturate(5) hue-rotate(-30deg)}30%{filter:none}45%{filter:brightness(2.2) sepia(1) saturate(5) hue-rotate(-30deg)}60%{transform:translateX(-10px);filter:none}100%{transform:none}}
.m-hurt{animation:mHurt .45s linear}
@keyframes mHurt{0%{transform:none;filter:none}10%{transform:translateX(16px);filter:brightness(5) saturate(0)}25%{transform:translateX(-8px);filter:none}40%{transform:translateX(8px);filter:brightness(5) saturate(0)}55%{transform:translateX(-4px);filter:none}100%{transform:none}}
.m-atk{animation:mAtk .6s ease-in}
@keyframes mAtk{0%{transform:none}30%{transform:translateX(14px) scale(1.04)}55%{transform:translateX(-120px) scale(1.12)}70%{transform:translateX(-100px) scale(1.08)}100%{transform:none}}
.m-atk-boss{animation:mAtkBoss .75s ease-in}
@keyframes mAtkBoss{0%{transform:none}35%{transform:translateX(24px) translateY(-14px) scale(1.06)}55%{transform:translateX(-140px) translateY(6px) scale(1.18)}72%{transform:translateX(-110px) scale(1.12)}100%{transform:none}}
.shake-big{animation:shakeBig .55s}
@keyframes shakeBig{0%,100%{transform:none}10%{transform:translate(-14px,6px)}25%{transform:translate(12px,-8px)}40%{transform:translate(-10px,4px)}55%{transform:translate(8px,-4px)}70%{transform:translate(-5px,2px)}85%{transform:translate(3px,0)}}
.redflash{position:absolute;inset:0;background:#ff1a1a;pointer-events:none;animation:redflash .45s forwards;mix-blend-mode:screen}
@keyframes redflash{0%{opacity:.55}100%{opacity:0}}
.boss-in{animation:bossIn 1.3s cubic-bezier(.2,.8,.3,1)}
@keyframes bossIn{0%{transform:translateY(40px) scale(.5);filter:brightness(0)}45%{transform:translateY(0) scale(1.08);filter:brightness(0)}60%{filter:brightness(3)}75%{transform:scale(1);filter:none}100%{transform:none}}
.die-boss{animation:dieBoss 1.5s forwards}
@keyframes dieBoss{0%,20%,40%,60%{filter:brightness(4) saturate(0);opacity:1}10%,30%,50%{filter:none;opacity:1}70%{transform:none;opacity:1}100%{transform:translateY(30px) scale(1.1,.2);opacity:0;filter:brightness(4) saturate(0)}}
.bosscall{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:clamp(26px,6vw,40px);color:#ff4d4d;text-shadow:3px 3px 0 #000,0 0 18px #f00;letter-spacing:.15em;pointer-events:none;animation:bosscall 1.6s forwards}
@keyframes bosscall{0%{opacity:0;transform:scale(2)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.hero{position:absolute;left:5%;bottom:10px;width:130px;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero img{width:120px;height:140px;object-fit:contain;object-position:bottom}
.hero .bar{width:120px}
.mon .hplabel,.hero .hplabel{font-size:12px;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:4px}
.float{position:absolute;font-size:30px;font-weight:bold;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000;pointer-events:none;animation:up .9s forwards}
.float.crit{color:var(--gold);font-size:36px}
.float.ouch{color:var(--red)}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-50px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lunge{animation:lunge .35s}
@keyframes lunge{50%{transform:translateX(60px) translateY(-14px)}}
.flash{animation:flash .4s}
@keyframes flash{0%,100%{opacity:1}25%,75%{opacity:.2}}
.die{animation:die .7s forwards}
@keyframes die{to{transform:scale(.2) rotate(30deg);opacity:0}}
.slash{position:absolute;right:16%;top:50px;width:110px;height:110px;pointer-events:none;animation:slash .35s forwards}
@keyframes slash{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:0;clip-path:inset(0 0 0 0)}}
.msg{min-height:1.4em;font-size:15px;text-align:center}

/* drill sheet */
.sheet{background:var(--paper);color:var(--ink);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 #0007;background-image:repeating-linear-gradient(transparent 0 38px,var(--paper-line) 38px 39px)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--pixel);font-size:14px;gap:8px}
.tag{background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:999px}
.tag.kaki{background:#b3322f}
.streak{color:#b3322f}
.sentence{font-family:var(--kyokasho);font-weight:600;font-size:clamp(26px,6.5vw,38px);line-height:1.7;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.sentence .t{border-bottom:4px solid #b3322f;padding:0 2px}
.sentence .h{background:#fff7d6;border:2px dashed #b3322f;border-radius:6px;padding:0 6px;color:#b3322f}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{font-family:var(--kyokasho);font-weight:600;font-size:clamp(20px,5vw,28px);background:#fffaf0;color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:12px 6px;box-shadow:0 4px 0 var(--ink);min-width:0;overflow-wrap:anywhere}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice.ok{background:#c9f2d3;border-color:#1f7a3a}
.choice.ng{background:#f8c9c9;border-color:#b3322f;opacity:.7}
.choice:disabled{cursor:default}
.answer{font-family:var(--kyokasho);font-size:20px;text-align:center}
.answer b{font-size:28px;color:#b3322f}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sheet .btn{color:var(--text)}
.judge{font-family:var(--pixel);text-align:center;font-size:16px;line-height:1.6;padding:8px;border-radius:6px;background:#fff7d6}
.judge.ok{background:#c9f2d3;color:#1f5a2e}.judge.ng{background:#f8d4d4;color:#8a1f1f}
.judge b{font-size:22px}
.judge.thinking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.canvas-wrap{display:flex;justify-content:center;overflow-x:auto}
canvas.pad{background:#fffdf5;border:3px solid var(--ink);border-radius:6px;touch-action:none;max-width:100%}
.canvas-wrap,canvas.pad{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,7,20,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ovbox{background:var(--night2);border:3px solid var(--gold);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 0 0 4px #000}
.ovbox h3{margin:0;font-size:26px;color:var(--gold);text-shadow:2px 2px 0 #000}
.ovbox p{margin:0;line-height:1.6}
.ovbox img{width:120px;height:140px;object-fit:contain}

function bushuChoices(ch, n = 4){

  const kind = ans.replace(/^.*?(へん|かんむり|がまえ|にょう|づくり|がしら|だれ)$/, '$1');

}

// ===== 効果音（楽器の録音を使う。鳴る瞬間だけ BGM を小さくして 聞こえやすくする）=====
const SE_INST = {square: 'trumpet', triangle: 'koto', sawtooth: 'french_horn'};
let seNoise = null;
function seReady(){
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  BGM.ctx();
  if (!seNoise) { seNoise = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate); const d = seNoise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return BGM.seOut();
}
// 音の高さ(Hz)と長さのならびを鳴らす。低い音はティンパニ、短い音は琴になる
function tone(seq, type = 'square', vol = .06){
  if (!S.sound) return;
  try {
    const out = seReady(); BGM.duck();
    let t = AC.currentTime;
    for (const [f, d] of seq) {
      const m = Math.round(69 + 12 * Math.log2(f));
      const inst = m < 48 ? 'timpani' : d <= .03 ? 'koto' : SE_INST[type] || 'trumpet';
      const v = Math.min(.95, vol * (d <= .03 ? 8 : 11));
      if (!BGM.smp(inst, m, t, Math.max(d * 1.4, .14), v, out, {att: .005, rel: .25, norm: true})) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = type; o.frequency.value = f; g.gain.setValueAtTime(Math.min(.5, vol * 4), t); g.gain.exponentialRampToValueAtTime(.001, t + d);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + d);
      }
      t += d * .9;
    }
  } catch (e) {}
}
// 刀を振る「シュッ」という風切り音
function swish(vol = .5, dur = .2){
  const out = seReady(), t = AC.currentTime;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = seNoise; f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(4200, t); f.frequency.exponentialRampToValueAtTime(700, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  src.connect(f); f.connect(g); g.connect(out); src.start(t); src.stop(t + dur + .02);
}
function hitSnd(m, vol, inst = 'taiko_drum', delay = .05){
  const out = seReady();
  if (!BGM.smp(inst, m, AC.currentTime + delay, 1, vol, out, {oneshot: true, norm: true})) tone([[90, .12]], 'sawtooth', .08);
}

// ===== 手書き漢字の判定（KanjiVGの書き順データと一画ずつ比べる）=====
const RECOG = (() => {
  const NP = 10;           // 1画あたりの点の数
  const MISS = 0.42;       // 画が足りない・多いときのペナルティ
  let TPL = null;          // 字 → 正規化ずみの画の配列

  function resample(pts, n = NP){
    const L = [0];
    for (let i = 1; i < pts.length; i++) L.push(L[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    const tot = L[L.length-1];
    if (!tot) return Array.from({length: n}, () => pts[0].slice());
    const out = []; let j = 0;
    for (let k = 0; k < n; k++) {
      const t = tot * k / (n - 1);
      while (j < L.length - 2 && L[j+1] < t) j++;
      const f = (t - L[j]) / ((L[j+1] - L[j]) || 1), a = pts[j], b = pts[j+1] || a;
      out.push([a[0] + (b[0]-a[0]) * f, a[1] + (b[1]-a[1]) * f]);
    }
    return out;
  }
  // 字全体の外わくで 0〜1 にそろえる（縦横比は保つ）
  function normalize(strokes){
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const s of strokes) for (const [x, y] of s) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const sc = Math.max(x1 - x0, y1 - y0, 1e-6), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return strokes.map(s => s.map(([x, y]) => [(x - cx) / sc, (y - cy) / sc]));
  }
  function strokeDist(a, b){
    let f = 0, r = 0;
    for (let i = 0; i < NP; i++) {
      f += Math.hypot(a[i][0]-b[i][0], a[i][1]-b[i][1]);
      r += Math.hypot(a[i][0]-b[NP-1-i][0], a[i][1]-b[NP-1-i][1]);
    }
    return Math.min(f, r * 1.3) / NP;  // 逆向きに書いた画は少しだけ減点
  }
  // ハンガリー法（正方行列の最小コスト割り当て）
  function hungarian(C){
    const n = C.length, u = new Array(n+1).fill(0), v = new Array(n+1).fill(0), p = new Array(n+1).fill(0), way = new Array(n+1).fill(0);
    for (let i = 1; i <= n; i++) {
      p[0] = i; let j0 = 0; const minv = new Array(n+1).fill(Infinity), used = new Array(n+1).fill(false);
      do {
        used[j0] = true; const i0 = p[j0]; let delta = Infinity, j1 = 0;
        for (let j = 1; j <= n; j++) if (!used[j]) {
          const cur = C[i0-1][j-1] - u[i0] - v[j];
          if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
          if (minv[j] < delta) { delta = minv[j]; j1 = j; }
        }
        for (let j = 0; j <= n; j++) { if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta; }
        j0 = j1;
      } while (p[j0] !== 0);
      do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
    }
    let cost = 0; for (let j = 1; j <= n; j++) cost += C[p[j]-1][j-1];
    return cost;
  }
  function charCost(inp, tpl){
    const n = Math.max(inp.length, tpl.length), C = [];
    for (let i = 0; i < n; i++) {
      const row = [];
      for (let j = 0; j < n; j++) row.push(i < inp.length && j < tpl.length ? strokeDist(inp[i], tpl[j]) : MISS);
      C.push(row);
    }
    return hungarian(C) / n;
  }
  return {
    load(data){
      TPL = {};
      for (const [ch, ss] of Object.entries(data)) {
        const strokes = ss.map(flat => { const pts = []; for (let i = 0; i < flat.length; i += 2) pts.push([flat[i], flat[i+1]]); return resample(pts); });
        TPL[ch] = normalize(strokes);
      }
    },
    ready: () => !!TPL,
    has: ch => !!(TPL && TPL[ch]),
    // strokes: [[ [x,y], ... ], ...]（画面の座標のままでよい）
    // 返り値: {ok, best, cost, targetCost}
    judge(rawStrokes, target, extra = []){
      if (!TPL || !TPL[target]) return null;
      if (!rawStrokes.length) return {ok: false, best: null, empty: true};
      const inp = normalize(rawStrokes.map(s => resample(s.length > 1 ? s : [s[0], [s[0][0] + .01, s[0][1]]])));
      const tCost = charCost(inp, TPL[target]);
      let best = target, bestCost = tCost;
      const nIn = inp.length;
      for (const [ch, tpl] of Object.entries(TPL)) {
        if (ch === target || Math.abs(tpl.length - nIn) > 3) continue;
        const c = charCost(inp, tpl);
        if (c < bestCost) { bestCost = c; best = ch; }
      }
      const ok = best === target && tCost < 0.22;
      return {ok, best, cost: bestCost, targetCost: tCost, nIn, nTpl: TPL[target].length};
    },
    _tpl: () => TPL,
  };
})();

const DAKU = {か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'};
Object.entries(DAKU).forEach(([a, b]) => DAKU[b] = a);
DAKU['ぢ'] = 'じ'; DAKU['づ'] = 'ず';
const O_ROW = 'こそとのほもよろごぞどぼぽょゅ';
const SOKUON_NEXT = 'かきくけこさしすせそたちつてとぱぴぷぺぽ';
function mutate(r){
  const c = [...r], out = new Set();
  c.forEach((ch, i) => { if (DAKU[ch]) { const x = c.slice(); x[i] = DAKU[ch]; out.add(x.join('')); } });
  c.forEach((ch, i) => {
    if (ch === 'う' && i > 0 && O_ROW.includes(c[i-1])) { const x = c.slice(); x.splice(i, 1); out.add(x.join('')); }
    if (O_ROW.includes(ch) && c[i+1] !== 'う') { const x = c.slice(); x.splice(i + 1, 0, 'う'); out.add(x.join('')); }
    if (ch === 'っ') { const x = c.slice(); x[i] = 'つ'; out.add(x.join('')); const y = c.slice(); y.splice(i, 1); out.add(y.join('')); }
    if (i > 0 && SOKUON_NEXT.includes(ch) && c[i-1] !== 'っ' && c[i-1] !== 'ん') { const x = c.slice(); x.splice(i, 0, 'っ'); out.add(x.join('')); }
    if (ch === 'ゅ') { const x = c.slice(); x[i] = 'ょ'; out.add(x.join('')); }
    if (ch === 'ょ') { const x = c.slice(); x[i] = 'ゅ'; out.add(x.join('')); }
    if (ch === 'ん' && i < c.length - 1) { const x = c.slice(); x.splice(i, 1); out.add(x.join('')); }
  });
  out.delete(r); return [...out];
}
function yomiChoices(it, n = 4){
  const set = new Set(), k = n - 1;
  // 同じ漢字の別の読みがあれば優先（例：収 → おさ／しゅう）
  const others = ALL.filter(o => o.target !== it.target && [...it.target].some(ch => o.target.includes(ch)) && o.yomi !== it.yomi && Math.abs(o.yomi.length - it.yomi.length) <= 2);
  const mut = shuffle(mutate(it.yomi));
  if (others.length) set.add(pick(others).yomi);
  for (const m of mut) { if (set.size >= k) break; set.add(m); }
  const sameLen = shuffle(ALL.filter(o => o.yomi !== it.yomi && Math.abs(o.yomi.length - it.yomi.length) <= 1));
  for (const o of sameLen) { if (set.size >= k + 1) break; set.add(o.yomi); }
  set.delete(it.yomi);
  return shuffle([it.yomi, ...[...set].slice(0, k)]);
}
function kakiChoices(it, n = 4){
  const t = [...it.target], set = new Set(), k = n - 1;
  const cand = [];
  t.forEach((ch, i) => (LOOKMAP[ch] || []).forEach(alt => { const x = t.slice(); x[i] = alt; cand.push(x.join('')); }));
  for (const m of shuffle(cand)) { if (set.size >= k) break; set.add(m); }
  let guard = 0;
  while (set.size < k + 1 && guard++ < 80) {
    const x = t.slice(); const i = Math.random() * t.length | 0;
    if (!/[\u4e00-\u9fff]/.test(x[i])) continue;
    x[i] = pick(KANJI_POOL); const s = x.join(''); if (s !== it.target) set.add(s);
  }
  set.delete(it.target);
  return shuffle([it.target, ...[...set].slice(0, k)]);
}

function seededRand(str){ let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function ensureDaily(){
  const d = today();
  if (S.daily && S.daily.date === d) return;
  const rnd = seededRand(d), hasWeak = Object.keys(S.weak).length >= 3;
  const pool = QUEST_POOL.filter(q => !q.needWeak || hasWeak);
  const kakiQ = pool.filter(q => q.kaki), other = pool.filter(q => !q.kaki);
  const pick = arr => arr.splice(Math.floor(rnd() * arr.length), 1)[0];
  const qs = [pick(kakiQ), pick(other), pick(other)];   // かきのクエストは毎日かならず1つ
  S.daily = {date: d, quests: qs.map(q => ({id: q.id, prog: 0, claimed: false})), bonus: false};
  save();
}
const questDef = id => QUEST_POOL.find(q => q.id === id);
// ゲームの中のできごとをクエストに数える
function track(ev, n = 1){
  ensureDaily();
  for (const q of S.daily.quests) {
    const def = questDef(q.id); if (def.ev !== ev || q.prog >= def.goal) continue;
    q.prog = ev === 'streak' ? Math.max(q.prog, n) : q.prog + n;
    if (q.prog >= def.goal) { q.prog = def.goal; toast(`クエスト達成！「${def.text}」<br><small>マップで ほうびを受け取ろう</small>`); tone([[784,.08],[1047,.08],[1319,.2]], 'triangle', .06); }
  }
  save();
}

  const newJobs = Object.entries(JOBS).filter(([, j]) => j.lv > oldLv && j.lv <= S.lv);
  const newSkills = SKILLS.filter(k => k.lv > oldLv && k.lv <= S.lv);
  const newTitle = titleOf(oldLv) !== titleOf(S.lv) ? titleOf(S.lv) : null;
  if (B) { B.heroHp = maxHpOf(S.lv); B.mp = maxMpOf(S.lv); }
  overlay(`${newGear ? `<div class="lvpair"><div>${heroImg(oldLv)}</div><div class="arrow">▶</div><div>${heroImg(S.lv)}</div></div>` : `<div>${heroImg(S.lv)}</div>`}
    <h3>レベルアップ！</h3><p>Lv ${oldLv} → <b style="color:var(--gold)">Lv ${S.lv}</b><br>こうげき ${atkOf(S.lv)}　さいだいHP ${maxHpOf(S.lv)}<br>HPとMPが全回復した！</p>
    ${newGear || newTitle || newSkills.length || newJobs.length ? `<div class="lvnew">
      ${newGear ? `<div>そうびが <b>パワーアップ</b> した！</div>` : ''}
      ${newTitle ? `<div>しょうごう「<b>${newTitle}</b>」をてにいれた！</div>` : ''}
      ${newSkills.map(k => `<div>わざ「<b>${k.name}</b>」をおぼえた！<br><span style="color:var(--muted)">${k.desc}</span></div>`).join('')}
      ${newJobs.map(([, j]) => `<div><b>${j.name}</b> に転職できるようになった！<br><span style="color:var(--muted)">マップの「転職の神殿」で 職業をかえられるよ</span></div>`).join('')}
      ${S.lv === 20 ? '<div>剣士が <b>金色のオーラ</b> をまとった！</div>' : ''}${S.lv === 30 ? '<div>剣士が <b>にじ色のオーラ</b> をまとった！</div>' : ''}
    </div>` : ''}
    <button class="btn gold" id="lvOk">つぎへ ▶</button>`, () => {
      $('#lvOk').onclick = () => {
        closeOv();
        if (B && $('#heroArt')) {
          $('#heroArt').innerHTML = heroImg(S.lv);
          $('#hero').className = 'hero ' + (S.lv >= 30 ? 'aura2' : S.lv >= 20 ? 'aura1' : '');
          updateHeroHp();
        }
        then();
      };
    });
  if (newGear) tone([[523,.1],[784,.1],[1047,.1],[1568,.4]], 'triangle', .07);
}
function defeat(ups){
  dexAdd();
  if (B.mon.rival) return rivalDown(ups);
  if (B.mon.kisho) return kishoDown(ups);
  if (B.mon.lastboss) return lastDown(ups);
  SE.win();
  $('#monArt img').style.animation = 'none';
  $('#monArt').classList.add(B.mon.boss ? 'die-boss' : 'die');
  if (B.mon.boss) anim($('#arena'), 'shake-big', 550);
  const bonus = Math.round(B.mon.boss ? 60 + B.idx * 10 : 15 + B.idx * 3) * (B.mon.shiny ? 3 : 1);
  const more = addExp(bonus); ups = ups.concat(more);
  S.beaten[B.sid] = (S.beaten[B.sid] || 0) + 1;
  track('kill'); if (B.mon.boss) track('boss');
  $('#msg').textContent = `${B.mon.name}をたおした！ けいけんち +${bonus}`;
  save();
  setTimeout(() => {
    const after = () => {
      if (B.mon.boss) {
        const k = KISHO_BY_STAGE[B.sid];
        if (k && !(S.kisho || {})[k.n] && !B.kishoDone) { B.kishoDone = true; return kishoAppear(k); }
        return stageClear();
      }
      const ev = RIVAL_EVENTS[B.sid];
      if (ev && B.mi === ev.after && !(S.rival || {})[B.sid] && !B.rivalDone) { B.rivalDone = true; return rivalAppear(ev); }
      B.mi++; spawn(); renderBattle();
      $('#msg').textContent = `${B.mon.name}があらわれた！`;
    };
    ups.length ? showLevelUp(ups, after) : after();
  }, B.mon.boss ? 1600 : 900);
}
function stageClear(){
  BGM.play('fanfare');
  const extra = ['weak', 'rev'].includes(B.sid);
  const firstClear = !extra && !S.cleared[B.sid];
  track('clear');
  if (!extra) S.cleared[B.sid] = (S.cleared[B.sid] || 0) + 1;
  const nextSt = B.st.ch && B.st.ch.stages[B.st.si + 1];
  save();
  const rate = Math.round(B.correct / Math.max(1, B.correct + B.wrong) * 100);
  // ★1 クリア／★2 正答率90%以上／★3 ダメージを受けずにクリア
  const got = [true, rate >= 90, !B.dmgTaken], nStar = got.filter(Boolean).length;
  let starMsg = '';
  if (!extra && B.st.ch) {
    const old = (S.stars || {})[B.sid] || 0;
    if (nStar > old) { S.stars[B.sid] = nStar; S.tama += (nStar - old) * 5; starMsg = `<p style="color:var(--gold)">★ ${nStar - old}こ ふえた！ 玉鋼 +${(nStar - old) * 5}</p>`; }
  }
  if (B.sid === 'rev') { S.revDone = today(); S.tama += 10; starMsg = '<p style="color:var(--gold)">今日の 鬼の再来を たおした！ 玉鋼 +10</p>'; }
  save();
  const stars = `${'★'.repeat(nStar)}${'☆'.repeat(3 - nStar)}`;
  const starList = `<div class="starlist"><span class="on">★ クリア</span><span class="${got[1] ? 'on' : ''}">★ 正答率90%以上</span><span class="${got[2] ? 'on' : ''}">★ ダメージを受けない</span></div>`;
  overlay(`<div>${heroImg(S.lv)}</div><h3>ステージクリア！</h3><p style="font-size:28px;color:var(--gold)">${stars}</p>${B.st.ch ? starList : ''}${starMsg}
    <p>${B.st.ch ? `${B.st.ci + 1}-${B.st.si + 1} ` : ''}${B.st.area}<br>正解 ${B.correct}問・まちがい ${B.wrong}問（正答率 ${rate}%）</p>
    ${B.wrong ? '<p style="font-size:14px;color:var(--muted)">まちがえた問題は「にがて復習」で出てくるよ</p>' : ''}
    ${nextSt && firstClear ? `<p style="color:var(--gold)">${nextSt.ci + 1}-${nextSt.si + 1}「${nextSt.area}」に行けるようになった！</p>` : ''}
    <div class="row"><button class="btn" id="again">もういちど</button>${nextSt ? '<button class="btn gold" id="toNext">つぎのステージへ</button>' : ''}<button class="btn ${nextSt ? '' : 'gold'}" id="toMap">マップへ</button></div>`, () => {
      const sid = B.sid;
      if (nextSt) $('#toNext').onclick = () => { closeOv(); startStage(nextSt.id); };
      $('#toMap').onclick = () => { closeOv(); B = null; renderMap(); };
      $('#again').onclick = () => { closeOv(); startStage(sid); };
    });
}

renderMap();
</script>
</body></html>
